spring.datasource.password=sio22
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# Gestion du schema par Hibernate
spring.jpa.hibernate.ddl-auto=update
# Valeur ddl-auto	Comportement :
    # none :	    Aucune gestion automatique du schéma
    # validate :	Vérifie la cohérence du schéma, sans le modifier
    # update :	    Crée les tables manquantes et tente d'adapter le schéma existant
    # create :	    Recrée le schéma géré par Hibernate à chaque démarrage
    # create-drop :	Recrée le schéma au démarrage et le supprime à la fermeture normale


